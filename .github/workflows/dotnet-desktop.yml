name: .NET Desktop CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotnet-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    name: Build, test, and publish
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.424'

      - name: Restore
        run: dotnet restore .\MacWinUI.sln --configfile .\NuGet.Config

      - name: Build Release
        run: dotnet build .\MacWinUI.sln -c Release --no-restore

      - name: Test Release
        run: dotnet test .\MacWinUI.sln -c Release --no-build --no-restore --logger "trx;LogFileName=MacWinUI.Tests.trx" --results-directory .\artifacts\test-results

      - name: Publish application
        run: dotnet publish .\src\MacWinUI.App\MacWinUI.App.csproj -c Release --no-build --no-restore -o .\artifacts\publish

      - name: Upload published application
        uses: actions/upload-artifact@v4
        with:
          name: MacWinUI-win-x64-framework-dependent
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacWinUI-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14